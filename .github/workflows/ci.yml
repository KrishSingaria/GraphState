name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows-msvc-release }
          - { os: macos-14,     preset: macos-release }
          - { os: ubuntu-24.04, preset: linux-release }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log || {
            ERR=$(tail -n 30 build.log | tr '\r\n' ' ')
            echo "::error title=Build Failure on ${{ matrix.preset }}::$ERR"
            exit 1
          }
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --preset ${{ matrix.preset }} -L unit --output-on-failure 2>&1 | tee test.log || {
            ERR=$(tail -n 35 test.log | tr '\r\n' ' ')
            echo "::error title=Test Failure on ${{ matrix.preset }}::$ERR"
            exit 1
          }
      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/${{ matrix.preset }}/graphstate.exe dist/
          else
            cp build/${{ matrix.preset }}/graphstate dist/
          fi
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphstate-${{ matrix.preset }}
          path: dist/*
          if-no-files-found: error
  db-tests:
    runs-on: ubuntu-24.04
    services:
      falkordb:
        image: falkordb/falkordb-server:6.0.2
        ports: ["6390:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: cmake --preset linux-release
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset linux-release 2>&1 | tee build.log || {
            ERR=$(tail -n 30 build.log | tr '\r\n' ' ')
            echo "::error title=Build Failure on db-tests::$ERR"
            exit 1
          }
      - name: Wait for FalkorDB
        shell: bash
        run: |
          for i in {1..20}; do
            if nc -z 127.0.0.1 6390; then
              echo "FalkorDB is ready on port 6390!"
              exit 0
            fi
            echo "Waiting for FalkorDB..."
            sleep 1
          done
          echo "FalkorDB did not become ready in time"
          exit 1
      - name: Run DB Tests
        shell: bash
        run: |
          set -o pipefail
          ctest --preset linux-release -L "db|e2e" --output-on-failure 2>&1 | tee test.log || {
            ERR=$(tail -n 35 test.log | tr '\r\n' ' ')
            echo "::error title=Test Failure on db-tests::$ERR"
            exit 1
          }
